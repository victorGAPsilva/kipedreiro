<!DOCTYPE html>
<html lang="pt-BR">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kipedreiro - Serviços de construção e reforma. Contrate os melhores profissionais para seus projetos.">
    <meta name="keywords" content="Construção, Reforma, Serviços, Projetos, Profissionais">
    <meta name="author" content="Kipedreiro">
    <meta name="robots" content="index, follow">
    <title>Kipedreiro</title>
    <link rel="stylesheet" href="assets/css/style.css">

<body>
    <header id="header"></header>
    <main>
        <section class="servicos-pagina">
            <div class="container-servicos-pagina">
                <div class="cards-servico-pagina">
                    <div class="card-servico-pagina-vertical">
                        <figure>
                            <img src="assets/img/servico 1.jpg" alt="serviço 1" class="img-card-servico-pagina-vertical">
                            <figcaption>
                                <h3>Pintura</h3>
                                <p>Acabamento final com pintura de alta qualidade para valorizar e proteger sua obra, interna ou externa.

                                </p>
                            </figcaption>
                        </figure>
                    </div>
                    <div class="card-servico-pagina-vertical">
                        <figure>
                            <img src="assets/img/servico 2.jpg" alt="servico 2" class="img-card-servico-pagina-vertical">
                            <figcaption>
                                <h3>Alvenaria</h3>
                                <p>Construção de paredes sólidas e resistentes com blocos e tijolos, garantindo estrutura segura e acabamento perfeito.</p>
                            </figcaption>
                        </figure>
                    </div>
                    <div class="card-servico-pagina-vertical">
                        <figure>
                            <img src="assets/img/servico 3.png" alt="servico 3" class="img-card-servico-pagina-vertical">
                            <figcaption>
                                <h3>Eletrica</h3>
                                <p>Instalações elétricas com segurança e qualidade, do padrão de entrada à fiação interna. Manutenção, correções e montagens de quadros elétricos.</p>
                            </figcaption>
                        </figure>
                    </div>
                </div>
                <div class="hero">
                    <div class="conteudo-hero">
                        <img src="assets/img/icon/018-idea-1.png" alt="ideia de projeto" class="icon">
                        <p>contrate os nossos serviços</p>
                         <button class="botao-orcamento"><a href="contato.html">Orçamento</a></button>
                    </div>
                </div>
                <div class="cards-servico-pagina">
                    <div class="card-servico-pagina">
                        <figure>
                            <img src="assets/img/worker-applying-mortar-with-trowel-brick.jpg" alt="servico 4" class="img-card-servico-pagina">
                            <figcaption>
                                <h3>Estrutura de Concreto Armado</h3>
                                <p>Montagem de formas, armação e concretagem de pilares, vigas e lajes que sustentam a edificação.</p>
                            </figcaption>
                        </figure>
                    </div>
                    <div class="card-servico-pagina">
                        <figure>
                            <img src="assets/img/steel-bar-site-construction.jpg" alt="servico 5" class="img-card-servico-pagina">
                            <figcaption>
                                <h3>Impermeabilização</h3>
                                <p>Aplicação de materiais e técnicas para evitar infiltrações em áreas como lajes, fundações e caixas d'água.</p>
                            </figcaption>
                        </figure>
                    </div>
                    <div class="card-servico-pagina">
                        <figure>
                            <img src="assets/img/side-view-man-with-orange-vest-pointing.jpg" alt="servico 6" class="img-card-servico-pagina">
                            <figcaption>
                                <h3>Cobertura</h3>
                                <p>Instalação de telhados ou lajes de cobertura para proteger a construção das intempéries.</p>
                            </figcaption>
                        </figure>
                    </div>
                    <div class="card-servico-pagina">
                        <figure>
                            <img src="assets/img/pouring-concrete-as-foundation.jpg" alt="servico 7" class="img-card-servico-pagina">
                            <figcaption>
                                <h3>Revestimento Interno e Externo</h3>
                                <p>Aplicação de argamassa, reboco, massa fina, gesso, pintura e cerâmicas para acabamento das superfícies.</p>
                            </figcaption>
                        </figure>
                    </div>
                    <div class="card-servico-pagina">
                        <figure>
                            <img src="assets/img/man-using-digital-tablet-front-construction-site-with-building-background-technology-development-concept.jpg" alt="servico 8" class="img-card-servico-pagina">
                            <figcaption>
                                <h3>Instalações Hidrossanitárias</h3>
                                <p>Execução da rede de água potável, esgoto e drenagem pluvial dentro da edificação</p>
                            </figcaption>
                        </figure>
                    </div>
                    <div class="card-servico-pagina">
                        <figure>
                            <img src="assets/img/hand-worker-plastering-cement-brick-wall-construction-site.jpg" alt="servico 9" class="img-card-servico-pagina">
                            <figcaption>
                                <h3>Instalações Elétricas</h3>
                                <p>Montagem da rede elétrica, incluindo conduítes, fiação, quadros de distribuição e tomadas.</p>
                            </figcaption>
                        </figure>
                    </div>
                </div>
            </div>
        </section>
          </main>
        <footer id="footer"></footer>
          <script src="assets/JS/script.js" type="module" defer></script>  
        </body>
</html>
