<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kipedreiro</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

</head>
<body>
    <header id="header">
    </header>
    <main>
        <section class="hero">
            <div class="conteudo-hero">
                <img src="assets/img/icon/018-idea-1.png" alt="Ideia de projeto" class="icon">
                <p1>Contrate os nossos serviços</p1>
                <button class="botao-orcamento">ORÇAMENTO</button>
            </div>
        </section>
        <section class="servicos">
            <h3 class="titulo">Os nossos serviços</h3>
            <div class="container-servicos">
                <div class="cards" id="container_cards_servico">
                </div>
                <div class="botao-projetos">
                    <a href="servicos.html" class="botao-orcamento">Nossos serviços</a>
                </div>
        </section>
        <section class="projetos">
            <h3 class="titulo">Nossos Projetos</h3>
            <div class="container-projetos">
                <div class="cards-projeto" id="cards-projeto">
                   
                </div>
            </div>
            <div class="botao-projetos">
                <a href="projetos.html" class="botao-orcamento">Todos os projetos</a>
            </div>
        </section>
        <section class="processos">
            <h3 class="titulo">Os Nossos Processos</h3>
            <div class="container-processo">
                <div class="cards" id="cards_processos">
                </div>
        </section>
        <section class="testemunhos">
            <h3 class="titulo">O que dizem sobre nós</h3>
            <div id="carouselId" class="carousel slide w-50" data-bs-ride="carousel">
                <ol class="carousel-indicators">
                    <li data-bs-target="#carouselId" data-bs-slide-to="0" class="active" aria-current="true"
                        aria-label="First slide"></li>
                    <li data-bs-target="#carouselId" data-bs-slide-to="1" aria-label="Second slide"></li>
                    <li data-bs-target="#carouselId" data-bs-slide-to="2" aria-label="Third slide"></li>
                </ol>
                <div class="carousel-inner" role="listbox">
                    <div class="carousel-item active">
                        <img src="assets/img/paisagem.jpg" class="w-100 d-block" alt="First slide" />
                        <div class="carousel-caption d-none d-md-block text-black">
                            <h3>Maria Aparecida</h3>
                            <p>Ótimo serviço de elétrica.</p>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="assets/img/paisagem.jpg" class="w-100 d-block" alt="Second slide" />
                        <div class="carousel-caption d-none d-md-block text-black">
                            <h3>Neymar Jr</h3>
                            <p>Ótima construção, sem igual.</p>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="assets/img/paisagem.jpg" class="w-100 d-block" alt="Third slide" />
                        <div class="carousel-caption d-none d-md-block text-black">
                            <h3>LeBron James</h3>
                            <p>The best construction in the world.</p>
                        </div>
                    </div>
                </div>
                <button class="carousel-control-prev bg-black" type="button" data-bs-target="#carouselId"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon bg-black" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next bg-black" type="button" data-bs-target="#carouselId"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </section>
    </main>
    <footer id="footer">
    </footer>

    <script src="/assets/JS/script.js" type="module" defer></script>

</body>

</html>
<article></article>
