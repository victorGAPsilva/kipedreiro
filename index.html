<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kipedreiro - Serviços de construção e reforma. Contrate os melhores profissionais para seus projetos.">
    <meta name="keywords" content="Construção, Reforma, Serviços, Projetos, Profissionais">
    <meta name="author" content="Kipedreiro">
    <meta name="robots" content="index, follow">
    <title>Kipedreiro</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header id="header">
    </header>
    <main>
        <section class="hero">
            <div class="conteudo-hero">
                <img src="assets/img/icon/018-idea-1.png" alt="Ideia de projeto" class="icon">
                <p1>Contrate os nossos serviços</p1>
                <button class="botao-orcamento">ORÇAMENTO</button>
            </div>
        </section>
        <section class="servicos">
            <h3 class="titulo">Os nossos serviços</h3>
            <div class="container-servicos">
                <div class="cards" id="container_cards_servico">
                </div>
                <div class="botao-projetos">
                    <a href="servicos.html" class="botao-orcamento">Nossos serviços</a>
                </div>
        </section>
        <section class="projetos">
            <h3 class="titulo">Nossos Projetos</h3>
            <div class="container-projetos">
                <div class="cards-projeto" id="cards-projeto">
                   
                </div>
            </div>
            <div class="botao-projetos">
                <a href="projetos.html" class="botao-orcamento">Todos os projetos</a>
            </div>
        </section>
        <section class="processos">
            <h3 class="titulo">Os Nossos Processos</h3>
            <div class="container-processo">
                <div class="cards" id="cards_processos">
                </div>
        </section>
        <section class="testemunhos">
            <h3 class="titulo">O que dizem sobre nós</h3>
            <div class="testemunhos_hero">
                <div class="conteudo_hero_testemunhos" id="testemunho_comentario">
                    <div class="testemunho-controles">
                        <button id="prev-testemunho" class="botoes_slides_esquerdo"><</button>
                        <button id="next-testemunho" class="botoes_slides_direita">></button>
                      </div>
                </div>
            </div>
        </section>
                    
    </main>
    <footer id="footer">
    </footer>
    
    <script src="assets/JS/script.js" type="module" defer></script>

</body>

</html>
